spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/stock_control
    username: stock_user
    password: stock_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Crea/actualiza el esquema desde las entidades (ideal para local).
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

# En local desactivamos Firebase: entra el filtro dev que te autentica como ADMIN.
security:
  firebase:
    enabled: false
